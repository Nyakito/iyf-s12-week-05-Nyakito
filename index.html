<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A clean, interactive to-do list application built with vanilla JavaScript.">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-shell">
        <section class="todo-card" aria-labelledby="page-title">
            <header class="app-header">
                <p class="eyebrow">WEEK 05 · JAVASCRIPT</p>
                <h1 id="page-title">My To-Do List</h1>
                <p class="subtitle">Capture the work. Finish the work.</p>
            </header>

            <form id="todo-form" class="todo-form" novalidate>
                <label class="sr-only" for="todo-input">New task</label>
                <input
                    id="todo-input"
                    name="todo"
                    type="text"
                    placeholder="What needs to be done?"
                    maxlength="200"
                    autocomplete="off"
                    required
                >
                <button type="submit" class="add-button">Add</button>
            </form>

            <p id="form-message" class="form-message" role="alert" aria-live="polite"></p>

            <div class="toolbar">
                <div class="filters" role="group" aria-label="Filter tasks">
                    <button type="button" class="filter active" data-filter="all" aria-pressed="true">All</button>
                    <button type="button" class="filter" data-filter="active" aria-pressed="false">Active</button>
                    <button type="button" class="filter" data-filter="completed" aria-pressed="false">Completed</button>
                </div>
                <span id="task-count" class="task-count" aria-live="polite">0 items left</span>
            </div>

            <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

            <div id="empty-state" class="empty-state">
                <span class="empty-icon" aria-hidden="true">✓</span>
                <strong id="empty-title">Nothing here yet.</strong>
                <span id="empty-text">Add your first task above.</span>
            </div>

            <footer class="app-footer">
                <button type="button" id="clear-completed" class="clear-button">Clear Completed</button>
            </footer>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
