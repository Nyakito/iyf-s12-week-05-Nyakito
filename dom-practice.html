<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Practice</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px;
            font-family: system-ui, sans-serif;
            color: #172033;
            background: #f1f5f9;
        }
        .container {
            width: min(100%, 760px);
            margin: 0 auto;
            padding: 24px;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            background: #fff;
        }
        .highlight { background-color: #fef08a; }
        .nav-list { display: flex; gap: 16px; padding: 0; list-style: none; }
        .nav-link { color: #4338ca; }
        form { display: grid; gap: 10px; max-width: 420px; }
        input, button { padding: 10px 12px; font: inherit; }
    </style>
</head>
<body>
    <header id="main-header">
        <h1>DOM Practice</h1>
        <nav>
            <ul class="nav-list">
                <li><a href="#" class="nav-link">Home</a></li>
                <li><a href="#" class="nav-link">About</a></li>
                <li><a href="#" class="nav-link">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <article>
            <h2 class="title">Article Title</h2>
            <p class="content">This is the first paragraph.</p>
            <p class="content">This is the second paragraph.</p>
        </article>

        <section>
            <h2>Form Section</h2>
            <form id="contact-form">
                <input type="text" id="name" name="name" placeholder="Name">
                <input type="email" id="email" name="email" placeholder="Email">
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026</p>
    </footer>

    <script src="dom.js"></script>
</body>
</html>
